name: nutri_snap
description: "YOTRACKEZ - Snap. Analyze. Eat Smart."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  shared_preferences: ^2.3.4
  image: ^4.3.0
  http: ^1.2.0
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2
  pedometer: ^4.0.2
  vector_math: ^2.1.4
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0
  rive: 0.14.11
  mobile_scanner: ^7.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/model/food_labels.txt
    - assets/data/nutrition_db.json
    - assets/avatars/
    - assets/sounds/
    - assets/models/
    - assets/rive/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#07080F"
    theme_color: "#7B6FFF"
